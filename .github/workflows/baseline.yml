name: baseline watch

# ベースライン監視。2時間おきに1回だけ巡回する。
# cron は UTC。混雑を避けるため :00 ではなく :17 にずらしている。
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "メールを送らず標準出力に出す"
        type: boolean
        default: false
      seed:
        description: "通知せず現状をDBへ取り込む（初回用）"
        type: boolean
        default: false
      check_mail:
        description: "巡回せず、Gmailにログインできるかだけ確かめる"
        type: boolean
        default: false

concurrency:
  group: jalan-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 見張り（healthchecks.io）。台帳は mori-lab-dev/morilab-ops の jobs.yaml。
    # 手動の dry_run / seed / check_mail は通知経路を通らないので見張りに数えない。
    # secret HC_PING_KEY が無ければ何もしない。
    env:
      HC_PING_KEY: ${{ secrets.HC_PING_KEY }}
      HC_SLUG: jalan-baseline
      HC_ENABLED: ${{ !inputs.dry_run && !inputs.seed && !inputs.check_mail }}
    steps:
      - name: 見張り（開始）
        if: env.HC_PING_KEY != '' && env.HC_ENABLED == 'true'
        run: curl -fsS -m 10 --retry 3 -o /dev/null "https://hc-ping.com/$HC_PING_KEY/$HC_SLUG/start" || echo "::warning::healthchecks へ送れませんでした"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 巡回
        # Gmail認証情報(GMAIL_USER/GMAIL_APP_PASSWORD/MAIL_TO)は
        # notify-jalan Edge Function側のシークレットに一本化した(2026-09-02)。
        # ここでは Supabase の接続情報だけを渡す。
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MIN_DISCOUNT_YEN: ${{ vars.MIN_DISCOUNT_YEN }}
          MAX_MIN_SPEND_YEN: ${{ vars.MAX_MIN_SPEND_YEN }}
          NOTIFY_ON_SOLD_OUT: ${{ vars.NOTIFY_ON_SOLD_OUT }}
          # 通知する地域。空なら制限なし。検知と保存は従来どおり行う
          NOTIFY_REGIONS: ${{ vars.NOTIFY_REGIONS }}
          NOTIFY_UNKNOWN_REGION: ${{ vars.NOTIFY_UNKNOWN_REGION }}
        run: >
          python -m jalan_watcher.main
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ inputs.seed && '--seed' || '' }}
          ${{ inputs.check_mail && '--check-mail' || '' }}
      - name: 見張り（終了）
        # cancelled（concurrency で押し出された回）では送らない。次の回が送る
        if: always() && env.HC_PING_KEY != '' && env.HC_ENABLED == 'true' && job.status != 'cancelled'
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then s=""; else s="/fail"; fi
          curl -fsS -m 10 --retry 3 -o /dev/null --data-raw "status=$JOB_STATUS $RUN_URL" \
            "https://hc-ping.com/$HC_PING_KEY/$HC_SLUG$s" || echo "::warning::healthchecks へ送れませんでした"
