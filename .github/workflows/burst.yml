name: burst watch (10:00 JST)

# 配布は 10:00 JST に集中するため、その前後を1分間隔で張り込む。
#
# GitHub Actions の schedule は当てにならない。実測（2026-09-02・public）:
#   予定 06:17 UTC → 発火せず
#   予定 08:17 UTC → 発火せず
#   予定 10:17 UTC → 11:27 UTC 作成（約70分の遅延）
#   予定 12:17 UTC → 64分経っても発火せず
# 4枠中で確実に走ったのは1枠だけ。private時代（00:47予定が05:44作成＝約5時間）
# よりは縮んだが、public でも「遅れる」だけでなく「そもそも来ない」。
#
# そこで2段構えにしてある。
#   対策A（遅延対策）: 起動を張り込み窓よりずっと早く置き、ジョブの中で
#     09:50 まで待ってから1分間隔で回す（--loop-from / --loop-until）。
#     いちばん遅い 08:08 JST 起動でも、70分ずれて 09:18 なので窓に間に合う。
#   対策B（間引き対策）: 起動を3本に散らす。どれか1本でも発火すれば張り込める。
#     concurrency で直列化してあるので、2本目以降が走っても
#     窓を過ぎていれば main.py が1回巡回して即終了する（対策C）。
#   対策C: 窓を過ぎて起動したら翌日まで待たず1回で終える。
#   対策D: --max-minutes で待機込みの上限をかける。
#
# public は実行時間が無制限なので、待機が伸びても占有が増えても実害はない。
# 3本とも間引かれる日はさすがに救えないので、絶対に落とせない日は
# workflow_dispatch で手動起動する（手動は遅延なしで即走る）。
on:
  schedule:
    - cron: "38 21 * * *"   # 06:38 JST
    - cron: "38 22 * * *"   # 07:38 JST
    - cron: "08 23 * * *"   # 08:08 JST
  workflow_dispatch:
    inputs:
      loop_from:
        description: "JSTの張り込み開始時刻 HH:MM（空なら即開始）"
        type: string
        default: "09:50"
      loop_until:
        description: "JSTの終了時刻 HH:MM"
        type: string
        default: "10:35"
      interval_sec:
        description: "巡回間隔（秒）"
        type: string
        default: "60"
      dry_run:
        description: "メールを送らず標準出力に出す"
        type: boolean
        default: false

concurrency:
  group: jalan-watch
  cancel-in-progress: false

jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 張り込み巡回
        # Gmail認証情報(GMAIL_USER/GMAIL_APP_PASSWORD/MAIL_TO)は
        # notify-jalan Edge Function側のシークレットに一本化した(2026-09-02)。
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MIN_DISCOUNT_YEN: ${{ vars.MIN_DISCOUNT_YEN }}
          NOTIFY_ON_SOLD_OUT: ${{ vars.NOTIFY_ON_SOLD_OUT }}
        run: >
          python -m jalan_watcher.main
          --loop-from "${{ inputs.loop_from || '09:50' }}"
          --loop-until "${{ inputs.loop_until || '10:35' }}"
          --interval-sec "${{ inputs.interval_sec || '60' }}"
          --max-minutes 245
          ${{ inputs.dry_run && '--dry-run' || '' }}
