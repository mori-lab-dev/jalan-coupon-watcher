name: burst watch (10:00 JST)

# 配布は 10:00 JST に集中するため、その前後を1分間隔で張り込む。
#
# GitHub Actions の schedule は「数分」ではなく「数十分〜数時間」ずれる。
# 実測:
#   private (2026-09-01): 00:47 UTC 予定の回が 05:44 UTC 作成。約5時間の遅延
#   public  (2026-09-02): 10:17 UTC 予定の回が 11:27 UTC 作成。約70分の遅延
#                         さらに 06:17 と 08:17 の枠は発火せず間引かれた
# public にしても遅延と間引きは残るため、それを前提に組む。
#   → 対策1: 起動を張り込み窓よりずっと早く（07:38 JST）に置き、
#            ジョブの中で 09:50 まで待ってから 1分間隔で回す（--loop-from / --loop-until）。
#            余裕は132分。実測70分の遅延に対しておよそ2倍の幅をとってある。
#   → 対策2: それでも間に合わなかった場合、main.py は翌日まで待たずに
#            1回だけ巡回して終了する（ジョブが何時間も居座らないように）。
#   → 対策3: --max-minutes で待機込みの上限をかける。
#
# 待機時間が伸びるぶんジョブの占有は長くなるが、public は実行時間が無制限なので
# 実害はない。枠ごと間引かれた場合だけはどうにもならないので、
# 大事な日は workflow_dispatch で手動起動する。
on:
  schedule:
    - cron: "38 22 * * *"
  workflow_dispatch:
    inputs:
      loop_from:
        description: "JSTの張り込み開始時刻 HH:MM（空なら即開始）"
        type: string
        default: "09:50"
      loop_until:
        description: "JSTの終了時刻 HH:MM"
        type: string
        default: "10:35"
      interval_sec:
        description: "巡回間隔（秒）"
        type: string
        default: "60"
      dry_run:
        description: "メールを送らず標準出力に出す"
        type: boolean
        default: false

concurrency:
  group: jalan-watch
  cancel-in-progress: false

jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 張り込み巡回
        # Gmail認証情報(GMAIL_USER/GMAIL_APP_PASSWORD/MAIL_TO)は
        # notify-jalan Edge Function側のシークレットに一本化した(2026-09-02)。
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MIN_DISCOUNT_YEN: ${{ vars.MIN_DISCOUNT_YEN }}
          NOTIFY_ON_SOLD_OUT: ${{ vars.NOTIFY_ON_SOLD_OUT }}
        run: >
          python -m jalan_watcher.main
          --loop-from "${{ inputs.loop_from || '09:50' }}"
          --loop-until "${{ inputs.loop_until || '10:35' }}"
          --interval-sec "${{ inputs.interval_sec || '60' }}"
          --max-minutes 185
          ${{ inputs.dry_run && '--dry-run' || '' }}
